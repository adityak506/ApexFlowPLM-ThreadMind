services:
  - type: web
    name: apexflow-threadmind
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLM_BACKEND
        value: mock
      - key: PLM_SEED_ON_STARTUP
        value: "true"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: PLM_SQLITE_PATH
        value: plm_mock.db
