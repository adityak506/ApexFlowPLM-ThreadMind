services:
  # Backend FastAPI REST API & AI MCP Engine
  - type: web
    name: apexflow-threadmind-backend
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PLM_BACKEND
        value: mock
      - key: PLM_SEED_ON_STARTUP
        value: "true"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: PLM_SQLITE_PATH
        value: plm_mock.db

  # Frontend React 18 + Vite Web Application
  - type: web
    name: apexflow-threadmind-frontend
    runtime: static
    rootDir: ui
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
