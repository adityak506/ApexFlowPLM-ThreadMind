# OpenTelemetry Collector Configuration for ThreadMind Mock PLM
# Collects Traces, Metrics, and Logs via OTLP and routes them to Tempo, Prometheus, and Loki.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

exporters:
  # Prometheus Metrics Exporter (Scraped by Prometheus on port 8889)
  prometheus:
    endpoint: 0.0.0.0:8889
    namespace: plm
    send_timestamps: true
    resource_to_telemetry_conversion:
      enabled: true

  # Distributed Tracing Exporter -> Grafana Tempo
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  # Structured Logs Exporter -> Grafana Loki
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true

  # Stdout Debug Exporter (helpful for container log inspection)
  debug:
    verbosity: normal

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]

    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]

    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki, debug]
