# Prometheus Configuration for ThreadMind Mock PLM
global:
  scrape_interval: 2s
  evaluation_interval: 2s
  scrape_timeout: 2s

rule_files:
  - "/etc/prometheus/alert_rules.yml"

scrape_configs:
  # Scrape OpenTelemetry Collector metrics bridge
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
        labels:
          system: "threadmind-plm"
          environment: "local"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
